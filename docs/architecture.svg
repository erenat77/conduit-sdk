<svg viewBox="0 0 860 720" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, sans-serif">

  <!-- Background -->
  <rect width="860" height="720" fill="#0f1117" rx="12"/>

  <!-- ── Title ───────────────────────────────────────────── -->
  <text x="430" y="38" text-anchor="middle" fill="#e2e8f0" font-size="18" font-weight="700" letter-spacing="0.5">conduit-sdk  ·  Architecture Overview</text>

  <!-- ═══════════════════════════════════════════════════════
       LAYER 1 — Your Application
  ════════════════════════════════════════════════════════ -->
  <rect x="30" y="58" width="800" height="68" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="430" y="80" text-anchor="middle" fill="#94a3b8" font-size="10" letter-spacing="1.5" font-weight="600">LAYER 1</text>
  <text x="430" y="100" text-anchor="middle" fill="#f1f5f9" font-size="15" font-weight="700">Your Application</text>
  <text x="430" y="118" text-anchor="middle" fill="#64748b" font-size="11">Calls generate() / stream() / embed() — no provider coupling</text>

  <!-- Arrow down -->
  <line x1="430" y1="126" x2="430" y2="148" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="424,144 430,154 436,144" fill="#475569"/>

  <!-- ═══════════════════════════════════════════════════════
       LAYER 2 — Abstract Clients (4 modalities)
  ════════════════════════════════════════════════════════ -->
  <rect x="30" y="154" width="800" height="90" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="430" y="174" text-anchor="middle" fill="#94a3b8" font-size="10" letter-spacing="1.5" font-weight="600">LAYER 2  ·  Abstract Client Classes  (clients/)</text>

  <!-- LLMClient box -->
  <rect x="50" y="184" width="172" height="48" rx="6" fill="#1d4ed8" fill-opacity="0.25" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="136" y="204" text-anchor="middle" fill="#93c5fd" font-size="11" font-weight="700">LLMClient</text>
  <text x="136" y="220" text-anchor="middle" fill="#60a5fa" font-size="9.5">generate() · stream()</text>
  <text x="136" y="232" text-anchor="middle" fill="#3b82f6" font-size="9">↳ _generate()  _stream()</text>

  <!-- ImageGenClient box -->
  <rect x="240" y="184" width="172" height="48" rx="6" fill="#7c3aed" fill-opacity="0.25" stroke="#8b5cf6" stroke-width="1.2"/>
  <text x="326" y="204" text-anchor="middle" fill="#c4b5fd" font-size="11" font-weight="700">ImageGenClient</text>
  <text x="326" y="220" text-anchor="middle" fill="#a78bfa" font-size="9.5">generate()</text>
  <text x="326" y="232" text-anchor="middle" fill="#7c3aed" font-size="9">↳ _generate()</text>

  <!-- VideoGenClient box -->
  <rect x="430" y="184" width="172" height="48" rx="6" fill="#b45309" fill-opacity="0.25" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="516" y="204" text-anchor="middle" fill="#fcd34d" font-size="11" font-weight="700">VideoGenClient</text>
  <text x="516" y="220" text-anchor="middle" fill="#fbbf24" font-size="9.5">generate()</text>
  <text x="516" y="232" text-anchor="middle" fill="#b45309" font-size="9">↳ _generate()</text>

  <!-- EmbeddingClient box -->
  <rect x="620" y="184" width="190" height="48" rx="6" fill="#065f46" fill-opacity="0.35" stroke="#10b981" stroke-width="1.2"/>
  <text x="715" y="204" text-anchor="middle" fill="#6ee7b7" font-size="11" font-weight="700">EmbeddingClient</text>
  <text x="715" y="220" text-anchor="middle" fill="#34d399" font-size="9.5">embed()</text>
  <text x="715" y="232" text-anchor="middle" fill="#065f46" font-size="9">↳ _embed()</text>

  <!-- Arrow down -->
  <line x1="430" y1="244" x2="430" y2="266" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="424,262 430,272 436,262" fill="#475569"/>

  <!-- ═══════════════════════════════════════════════════════
       LAYER 3 — BaseClient + Middleware Pipeline
  ════════════════════════════════════════════════════════ -->
  <rect x="30" y="272" width="800" height="130" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="430" y="292" text-anchor="middle" fill="#94a3b8" font-size="10" letter-spacing="1.5" font-weight="600">LAYER 3  ·  BaseClient  +  Middleware Pipeline  (core/ · utils/)</text>

  <!-- BaseClient -->
  <rect x="50" y="300" width="130" height="90" rx="6" fill="#0f172a" stroke="#1e3a5f" stroke-width="1.2"/>
  <text x="115" y="320" text-anchor="middle" fill="#7dd3fc" font-size="10.5" font-weight="700">BaseClient</text>
  <text x="115" y="336" text-anchor="middle" fill="#475569" font-size="9">Template Method</text>
  <line x1="65" y1="342" x2="165" y2="342" stroke="#1e3a5f" stroke-width="1"/>
  <text x="115" y="356" text-anchor="middle" fill="#64748b" font-size="9">_execute()</text>
  <text x="115" y="369" text-anchor="middle" fill="#64748b" font-size="9">close()</text>
  <text x="115" y="382" text-anchor="middle" fill="#64748b" font-size="9">__aenter__ / __aexit__</text>

  <!-- Pipeline arrow label -->
  <text x="203" y="348" text-anchor="middle" fill="#475569" font-size="9">delegates to</text>
  <line x1="180" y1="345" x2="218" y2="345" stroke="#334155" stroke-width="1" marker-end="url(#arr)"/>

  <!-- Middleware chain boxes -->
  <!-- Logging -->
  <rect x="220" y="300" width="118" height="90" rx="6" fill="#1a2744" stroke="#2563eb" stroke-width="1.2"/>
  <text x="279" y="320" text-anchor="middle" fill="#93c5fd" font-size="10" font-weight="700">Logging</text>
  <text x="279" y="334" text-anchor="middle" fill="#3b82f6" font-size="8.5">Observer pattern</text>
  <line x1="230" y1="340" x2="328" y2="340" stroke="#1e3a5f" stroke-width="1"/>
  <text x="279" y="354" text-anchor="middle" fill="#64748b" font-size="8.5">request_start()</text>
  <text x="279" y="366" text-anchor="middle" fill="#64748b" font-size="8.5">request_end()</text>
  <text x="279" y="378" text-anchor="middle" fill="#64748b" font-size="8.5">request_error()</text>

  <!-- chain arrow -->
  <polygon points="340,341 348,345 340,349" fill="#334155"/>
  <line x1="338" y1="345" x2="348" y2="345" stroke="#334155" stroke-width="1.2"/>

  <!-- Rate Limit -->
  <rect x="350" y="300" width="118" height="90" rx="6" fill="#1a2744" stroke="#2563eb" stroke-width="1.2"/>
  <text x="409" y="320" text-anchor="middle" fill="#93c5fd" font-size="10" font-weight="700">Rate Limit</text>
  <text x="409" y="334" text-anchor="middle" fill="#3b82f6" font-size="8.5">Token Bucket</text>
  <line x1="360" y1="340" x2="458" y2="340" stroke="#1e3a5f" stroke-width="1"/>
  <text x="409" y="354" text-anchor="middle" fill="#64748b" font-size="8.5">acquire(tokens)</text>
  <text x="409" y="366" text-anchor="middle" fill="#64748b" font-size="8.5">burst capacity</text>
  <text x="409" y="378" text-anchor="middle" fill="#64748b" font-size="8.5">req / minute</text>

  <!-- chain arrow -->
  <polygon points="470,341 478,345 470,349" fill="#334155"/>
  <line x1="468" y1="345" x2="478" y2="345" stroke="#334155" stroke-width="1.2"/>

  <!-- Retry -->
  <rect x="480" y="300" width="118" height="90" rx="6" fill="#1a2744" stroke="#2563eb" stroke-width="1.2"/>
  <text x="539" y="320" text-anchor="middle" fill="#93c5fd" font-size="10" font-weight="700">Retry</text>
  <text x="539" y="334" text-anchor="middle" fill="#3b82f6" font-size="8.5">Exp. back-off</text>
  <line x1="490" y1="340" x2="588" y2="340" stroke="#1e3a5f" stroke-width="1"/>
  <text x="539" y="354" text-anchor="middle" fill="#64748b" font-size="8.5">tenacity</text>
  <text x="539" y="366" text-anchor="middle" fill="#64748b" font-size="8.5">RateLimitError</text>
  <text x="539" y="378" text-anchor="middle" fill="#64748b" font-size="8.5">TimeoutError · 5xx</text>

  <!-- chain arrow -->
  <polygon points="600,341 608,345 600,349" fill="#334155"/>
  <line x1="598" y1="345" x2="608" y2="345" stroke="#334155" stroke-width="1.2"/>

  <!-- Cost -->
  <rect x="610" y="300" width="118" height="90" rx="6" fill="#1a2744" stroke="#2563eb" stroke-width="1.2"/>
  <text x="669" y="320" text-anchor="middle" fill="#93c5fd" font-size="10" font-weight="700">Cost</text>
  <text x="669" y="334" text-anchor="middle" fill="#3b82f6" font-size="8.5">Strategy pattern</text>
  <line x1="620" y1="340" x2="718" y2="340" stroke="#1e3a5f" stroke-width="1"/>
  <text x="669" y="354" text-anchor="middle" fill="#64748b" font-size="8.5">CostCalculator</text>
  <text x="669" y="366" text-anchor="middle" fill="#64748b" font-size="8.5">CostTracker</text>
  <text x="669" y="378" text-anchor="middle" fill="#64748b" font-size="8.5">session totals</text>

  <!-- "Chain of Responsibility" label -->
  <rect x="216" y="394" width="516" height="16" rx="4" fill="#0f172a"/>
  <text x="474" y="405" text-anchor="middle" fill="#475569" font-size="9" letter-spacing="0.8">Chain of Responsibility  ·  outermost → innermost → [handler]</text>

  <!-- Arrow down -->
  <line x1="430" y1="410" x2="430" y2="430" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="424,426 430,436 436,426" fill="#475569"/>

  <!-- ═══════════════════════════════════════════════════════
       LAYER 4 — Your Provider Adapters
  ════════════════════════════════════════════════════════ -->
  <rect x="30" y="436" width="800" height="78" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="430" y="456" text-anchor="middle" fill="#94a3b8" font-size="10" letter-spacing="1.5" font-weight="600">LAYER 4  ·  Your Provider Adapters  (examples/providers/ or your own package)</text>

  <rect x="50" y="464" width="145" height="38" rx="5" fill="#0f172a" stroke="#1e3a5f" stroke-width="1"/>
  <text x="123" y="479" text-anchor="middle" fill="#7dd3fc" font-size="10" font-weight="600">OpenAI</text>
  <text x="123" y="494" text-anchor="middle" fill="#475569" font-size="9">LLM · Embedding</text>

  <rect x="212" y="464" width="145" height="38" rx="5" fill="#0f172a" stroke="#1e3a5f" stroke-width="1"/>
  <text x="285" y="479" text-anchor="middle" fill="#7dd3fc" font-size="10" font-weight="600">Anthropic</text>
  <text x="285" y="494" text-anchor="middle" fill="#475569" font-size="9">LLM · stream()</text>

  <rect x="374" y="464" width="145" height="38" rx="5" fill="#0f172a" stroke="#1e3a5f" stroke-width="1"/>
  <text x="447" y="479" text-anchor="middle" fill="#7dd3fc" font-size="10" font-weight="600">Replicate</text>
  <text x="447" y="494" text-anchor="middle" fill="#475569" font-size="9">Image</text>

  <rect x="536" y="464" width="145" height="38" rx="5" fill="#0f172a" stroke="#1e3a5f" stroke-width="1"/>
  <text x="609" y="479" text-anchor="middle" fill="#7dd3fc" font-size="10" font-weight="600">Runway</text>
  <text x="609" y="494" text-anchor="middle" fill="#475569" font-size="9">Video · async job poll</text>

  <rect x="698" y="464" width="112" height="38" rx="5" fill="#0f172a" stroke="#1e3a5f" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="754" y="479" text-anchor="middle" fill="#475569" font-size="10" font-weight="600">Your Provider</text>
  <text x="754" y="494" text-anchor="middle" fill="#374151" font-size="9">~50 lines</text>

  <!-- Arrow down -->
  <line x1="430" y1="514" x2="430" y2="534" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="424,530 430,540 436,530" fill="#475569"/>

  <!-- ═══════════════════════════════════════════════════════
       LAYER 5 — Shared Infrastructure (Registry + Models)
  ════════════════════════════════════════════════════════ -->
  <rect x="30" y="540" width="800" height="100" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="430" y="560" text-anchor="middle" fill="#94a3b8" font-size="10" letter-spacing="1.5" font-weight="600">LAYER 5  ·  Shared Infrastructure  (models/ · registry/)</text>

  <!-- Pydantic Models -->
  <rect x="50" y="568" width="240" height="62" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
  <text x="170" y="586" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="700">Pydantic Request / Response Models</text>
  <text x="170" y="601" text-anchor="middle" fill="#64748b" font-size="9.5">LLMRequest · ImageGenRequest · VideoGenRequest</text>
  <text x="170" y="615" text-anchor="middle" fill="#64748b" font-size="9.5">EmbeddingRequest  ·  LLMResponse  ·  Usage  ·  Cost</text>
  <text x="170" y="625" text-anchor="middle" fill="#374151" font-size="9">frozen=True  ·  validated at construction</text>

  <!-- Model Registry -->
  <rect x="310" y="568" width="240" height="62" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
  <text x="430" y="586" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="700">ModelRegistry</text>
  <text x="430" y="601" text-anchor="middle" fill="#64748b" font-size="9.5">ModelDefinition  ·  aliases  ·  pricing metadata</text>
  <text x="430" y="614" text-anchor="middle" fill="#64748b" font-size="9.5">resolve("gpt-4o")  ·  list_models(modality=)</text>
  <text x="430" y="625" text-anchor="middle" fill="#374151" font-size="9">thread-safe  ·  global singleton or isolated</text>

  <!-- Provider Registry -->
  <rect x="570" y="568" width="240" height="62" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
  <text x="690" y="586" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="700">ProviderRegistry</text>
  <text x="690" y="601" text-anchor="middle" fill="#64748b" font-size="9.5">register_factory(provider, modality, fn)</text>
  <text x="690" y="614" text-anchor="middle" fill="#64748b" font-size="9.5">create_client(provider, modality, config)</text>
  <text x="690" y="625" text-anchor="middle" fill="#374151" font-size="9">Abstract Factory pattern  ·  config-driven</text>

  <!-- ═══════════════════════════════════════════════════════
       Legend / design patterns
  ════════════════════════════════════════════════════════ -->
  <rect x="30" y="652" width="800" height="54" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="430" y="670" text-anchor="middle" fill="#475569" font-size="10" letter-spacing="1" font-weight="600">KEY DESIGN PATTERNS</text>
  <text x="430" y="688" text-anchor="middle" fill="#374151" font-size="9.5">
    Template Method · Chain of Responsibility · Strategy · Value Object · Registry · Abstract Factory · Structural Protocol · Observer
  </text>

  <!-- ══ Arrows / markers ══ -->
  <defs>
    <marker id="arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <polygon points="0,0 6,3 0,6" fill="#334155"/>
    </marker>
  </defs>

</svg>
