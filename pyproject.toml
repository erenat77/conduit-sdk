[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-conduit"
version = "0.1.2"
description = "A provider-agnostic SDK for LLM, image, video, and embedding model clients"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["llm", "ai", "sdk", "image-generation", "video-generation", "embeddings", "conduit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.7",
    "tenacity>=8.3",
    "anyio>=4.4",
]

[project.optional-dependencies]
openai = ["openai>=1.30"]
anthropic = ["anthropic>=0.25"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "pytest-timeout>=2.3",
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest-cov>=5.0",
]
all = ["llm-conduit[openai,anthropic]"]

[tool.hatch.build.targets.wheel]
packages = ["conduit_sdk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: calls real external APIs — requires OPENAI_API_KEY / ANTHROPIC_API_KEY (deselect with -m 'not integration')",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
warn_return_any = false
disallow_any_generics = false
disallow_subclassing_any = false
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["conduit_sdk.providers.*"]
# Provider adapters use optional-dependency imports (openai/anthropic).
# The _require_*() helpers return a module object at runtime (used for
# isinstance checks), which mypy cannot meaningfully type — the packages
# may not even be installed during type-checking. Suppress all errors here;
# the real correctness guarantee comes from the integration test suite.
ignore_errors = true
