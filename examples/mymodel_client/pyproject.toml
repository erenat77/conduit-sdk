[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mymodel-client"
version = "0.1.0"
description = "Async Python client for the MyModel API"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "conduit-sdk>=0.1.3",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "respx"]   # respx = httpx mock library

[project.urls]
Repository = "https://github.com/mycompany/mymodel-client"
